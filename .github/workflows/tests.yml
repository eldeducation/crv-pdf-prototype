# Runs every test on each push to main and on each pull request, so a change
# from any tool (Codex, Claude Code, a person) is checked the same way.
# No secrets, API keys, network video downloads or AI calls are used.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Python tests
        run: python -m unittest discover -p "test_*.py" -v
      - name: Upload screen tests (JavaScript)
        run: node --test test_video_upload_ui.cjs
