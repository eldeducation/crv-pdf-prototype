# Runs every test on each push to main and on each pull request, so a change
# from any tool (Codex, Claude Code, a person) is checked the same way.
# No secrets, API keys, network video downloads or AI calls are used.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VIDEO_PDF_REQUIRE_RENDER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install PDF test browser and Japanese fonts
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Python tests
        run: python -m unittest discover -p "test_*.py" -v
      - name: Upload screen tests (JavaScript)
        run: node --test test_video_upload_ui.cjs test_resume_ui.cjs
      - name: Verify current-source local package
        run: python scripts/build_local.py --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: local-package-${{ github.sha }}
          path: dist/crv-pdf-local.zip

  release-local:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: local-package-${{ github.sha }}
          path: dist
      - name: Publish the exact tested package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "local-${GITHUB_SHA}" dist/crv-pdf-local.zip --target "$GITHUB_SHA" --title "Local prototype ${GITHUB_SHA:0:8}" --notes "Built from the same commit as the passing tests. No API keys, videos, host paths or run history are included." --latest
